name: CI/CD Pipeline Docker Hub

on:
  push:
    branches: [ "feature/main" ]  # Cambiado para que dispare al hacer push a tu rama

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USER_DOCKERHUB }}
          password: ${{ secrets.PASSWORD_DOCKERHUB }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.USER_DOCKERHUB }}/mi-app-aws:latest